<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>进入画布</title>
<!--
  站点门禁登录页。
  必须完全自包含：不要引用 /assets 下的任何资源——那里被 nginx 门禁拦着，
  登录页自己会被挡在门外，表现为「登录框没样式 / 脚本不执行」。
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0e1116; color: #e6e8eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card {
    width: 340px; padding: 32px 28px; border-radius: 14px;
    background: #161b22; border: 1px solid #262c36; box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }
  h1 { margin: 0 0 6px; font-size: 19px; font-weight: 600; letter-spacing: .5px; }
  p.sub { margin: 0 0 22px; font-size: 13px; color: #8b949e; }
  input {
    width: 100%; padding: 11px 13px; font-size: 15px; border-radius: 9px;
    border: 1px solid #30363d; background: #0d1117; color: #e6e8eb; outline: none; transition: border-color .15s;
  }
  input:focus { border-color: #58a6ff; }
  button {
    width: 100%; margin-top: 14px; padding: 11px; font-size: 15px; font-weight: 500;
    border: 0; border-radius: 9px; background: #238636; color: #fff; cursor: pointer; transition: background .15s;
  }
  button:hover { background: #2ea043; }
  button:disabled { background: #21262d; color: #8b949e; cursor: default; }
  .msg { margin-top: 14px; font-size: 13px; min-height: 18px; color: #f85149; }
  .msg.ok { color: #3fb950; }
</style>
</head>
<body>
  <form class="card" id="f">
    <h1>天宫漫剧 · 无限画布</h1>
    <p class="sub">请输入访问密码</p>
    <input id="pw" type="password" placeholder="密码" autocomplete="current-password" autofocus>
    <button id="btn" type="submit">进 入</button>
    <div class="msg" id="msg"></div>
  </form>
<script>
  var f = document.getElementById('f');
  var pw = document.getElementById('pw');
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');

  // 已经登录过（cookie 还在）就别让用户再看一次登录框，直接进。
  fetch('/agnes/v1/models', { method: 'GET', credentials: 'same-origin' })
    .then(function (r) { if (r.ok) location.replace('/'); })
    .catch(function () {});

  function fail(text) {
    msg.className = 'msg';
    msg.textContent = text;
    btn.disabled = false;
    btn.textContent = '进 入';
  }

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!pw.value) { fail('请输入密码'); pw.focus(); return; }
    btn.disabled = true;
    btn.textContent = '验证中…';
    msg.className = 'msg';
    msg.textContent = '';
    fetch('/agnes/auth', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw.value })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) { return { ok: r.ok, d: d }; });
    }).then(function (res) {
      if (res.ok) {
        msg.className = 'msg ok';
        msg.textContent = '验证通过，正在进入…';
        location.replace('/');
      } else {
        fail((res.d && res.d.detail) || '密码不正确');
        pw.select();
      }
    }).catch(function () { fail('网络异常，请重试'); });
  });
</script>
</body>
</html>
