server {
    listen 127.0.0.1:19184;
    server_name edit.ai.cauai.fun;

    client_max_body_size 2g;

    location = /open-source/openchatcut-source-r7.tar.gz {
        alias /opt/edit-ai-openchatcut/open-source/openchatcut-source-r7.tar.gz;
        add_header Content-Disposition 'attachment; filename="openchatcut-source-r7.tar.gz"' always;
        add_header Cache-Control 'public, max-age=86400' always;
    }

    location = /open-source/ {
        default_type text/html;
        return 200 '<!doctype html><title>念念智剪 Source</title><a href="/open-source/openchatcut-source-r7.tar.gz">Download corresponding source for this deployment</a>';
    }

    location / {
        proxy_pass http://127.0.0.1:18085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
