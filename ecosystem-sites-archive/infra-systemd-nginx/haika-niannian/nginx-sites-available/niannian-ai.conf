server {
    listen 127.0.0.1:18082;
    listen 0.0.0.0:18082;
    server_name ai.cauai.fun;

    allow 127.0.0.1;
    allow 103.236.71.108;
    deny all;

    root /var/www/niannian-ai;
    index index.html;
    charset utf-8;
    client_max_body_size 1024m;

    location = /api/projects/NN-20260727052447-62C34D/selected-source-clip {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Niannian-Media-Accel 1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location = /_niannian_internal/NN-20260727052447-62C34D/analysis-2-S010-S018-selected-clip-v4.mp4 {
        internal;
        alias /srv/niannian-data/niannian-ai/jobs/NN-20260727052447-62C34D/deliverables/step01/media/analysis-2-S010-S018-selected-clip-v4.mp4;
        default_type video/mp4;
        etag off;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "private, max-age=300, must-revalidate" always;
        add_header ETag '"clip-756548ff75374a684195c0d74ac88e2b2e37c42c78859b7c390811ee94bf9825-source-2"' always;
        add_header Vary Cookie always;
        add_header X-Content-SHA256 756548ff75374a684195c0d74ac88e2b2e37c42c78859b7c390811ee94bf9825 always;
        add_header X-Source-Revision 2 always;
    }

    # Studio modules are content-addressed only by deployment state; never reuse stale same-path Canvas code.
    location ^~ /studio/assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_request_buffering off;
    }

    location = /director-desk {
        return 301 /director-desk/;
    }

    location ^~ /director-desk/ {
        alias /var/www/niannian-ai/director-desk/;
        index index.html;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|png|jpg|jpeg|webp|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

