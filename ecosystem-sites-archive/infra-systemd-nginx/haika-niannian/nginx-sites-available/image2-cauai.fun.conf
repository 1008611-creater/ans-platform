server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name image2.cauai.fun;

    ssl_certificate /etc/ssl/certs/image2.cauai.fun.crt;
    ssl_certificate_key /etc/ssl/private/image2.cauai.fun.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/image2-cauai.access.log;
    error_log /var/log/nginx/image2-cauai.error.log;

    location / {
        proxy_pass http://127.0.0.1:3052;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
