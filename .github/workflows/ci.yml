name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DATABASE_URL: "postgresql://test:test@localhost:5432/test"
  DIRECT_URL: "postgresql://test:test@localhost:5432/test"
  SMOKE_DATABASE_URL: "postgresql://test:test@localhost:5432/test"
  # CI 里缺浏览器或数据库属于配置错误，不允许静默跳过冒烟。
  SMOKE_MODE: "require"
  # 依赖审计服务不可达时按失败处理，避免生产依赖漏洞被静默忽略。
  AUDIT_MODE: "require"
  # 可访问性与性能门禁同样需要浏览器和冒烟库；缺前置条件时按失败处理，
  # 否则这两道检查在流水线里会静默跳过，等于没接。
  A11Y_MODE: "require"
  PERF_MODE: "require"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Ensure headless browser
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run verification gate
        run: npm run verify
