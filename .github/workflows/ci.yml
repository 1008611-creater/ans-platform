name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# New commits supersede checks for the same PR. Main releases keep distinct runs.
concurrency:
  group: ans-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_URL: "postgresql://test:test@localhost:5432/test"
  DIRECT_URL: "postgresql://test:test@localhost:5432/test"
  SMOKE_DATABASE_URL: "postgresql://test:test@localhost:5432/test"
  # CI 里缺浏览器或数据库属于配置错误，不允许静默跳过冒烟。
  SMOKE_MODE: "require"
  # 依赖审计服务不可达时按失败处理，避免生产依赖漏洞被静默忽略。
  AUDIT_MODE: "require"
  # 可访问性与性能门禁同样需要浏览器和冒烟库；缺前置条件时按失败处理，
  # 否则这两道检查在流水线里会静默跳过，等于没接。
  A11Y_MODE: "require"
  PERF_MODE: "require"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Cache compiler work only. Prisma generation, migrations, tests and build
      # still run; lockfile, schema and generator/config changes split the cache.
      - name: Cache Next.js compiler work
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-node24-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json', 'prisma/schema.prisma', 'prisma.config.ts', 'tsconfig.json', 'next.config.*', 'prompts.config.ts', 'postcss.config.*') }}-${{ github.sha }}
          restore-keys: |
            next-node24-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json', 'prisma/schema.prisma', 'prisma.config.ts', 'tsconfig.json', 'next.config.*', 'prompts.config.ts', 'postcss.config.*') }}-

      - name: Install dependencies
        run: npm ci

      - name: Ensure headless browser
        run: npx puppeteer browsers install chrome-headless-shell

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run verification gate
        run: npm run verify

  # 权威基线守卫 + Git/发布体检。只依赖 node 内置模块，不装依赖，所以依赖故障时它仍能挡住回退。
  # 这里刻意不加 --gh：管理 API 的告警（分支保护等）由人按 git-health --gh 复核，不让它把每次 CI 变红。
  authority:
    name: Authority
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # origin/main 只用于体检脚本对比"主干 vs 部署信号"，不参与判定。
      - name: Ensure origin/main is available
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      # 校验的是"这次提交的代码本身"（PR 的 merge ref / main 的 push commit）：
      # 任何把权威实现改回去的 PR 都会在这里红，且不会出现"修好了也永远红"的死锁。
      - name: Authority guard
        run: node .agents/skills/ans-delivery-governance/scripts/check-authority.mjs --worktree

      - name: Git and release health
        run: node .agents/skills/ans-delivery-governance/scripts/git-health.mjs
