name: Copilot access diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/copilot-access-diagnostic.yml

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect credential identity and model compatibility without inference
        env:
          COPILOT_DIAGNOSTIC_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          EXPECTED_OWNER: ${{ github.repository_owner }}
        run: |
          node <<'NODE'
          const token = process.env.COPILOT_DIAGNOSTIC_TOKEN;
          if (!token) {
            console.log('COPILOT_DIAGNOSTIC: missing credential');
            process.exit(1);
          }
          async function get(url, accept, extraHeaders = {}) {
            return fetch(url, {
              headers: { Authorization: `Bearer ${token}`, Accept: accept, 'User-Agent': 'ANS-read-only-access-diagnostic', ...extraHeaders },
              redirect: 'error', signal: AbortSignal.timeout(15000)
            });
          }
          async function main() {
            const identity = await get('https://api.github.com/user', 'application/vnd.github+json');
            console.log('COPILOT_IDENTITY_HTTP:', identity.status);
            if (!identity.ok) throw new Error('IDENTITY_LOOKUP_FAILED');
            const account = await identity.json();
            if (typeof account.login !== 'string') throw new Error('IDENTITY_FORMAT_INVALID');
            // Never publish the secret owner's login, account profile or raw response.
            console.log('COPILOT_OWNER_MATCHES_REPOSITORY:', account.login.toLowerCase() === process.env.EXPECTED_OWNER.toLowerCase());
            const models = await get('https://api.githubcopilot.com/models', 'application/json', { 'X-GitHub-Api-Version': '2026-07-01', 'Copilot-Integration-Id': 'agentic-workflows' });
            console.log('COPILOT_MODELS_HTTP:', models.status);
            if (!models.ok) throw new Error('MODEL_INVENTORY_LOOKUP_FAILED');
            const inventory = await models.json();
            if (!Array.isArray(inventory.data)) throw new Error('MODEL_INVENTORY_FORMAT_INVALID');
            // Publish model compatibility only; no identity, quota or billing fields.
            console.log('COPILOT_MODEL_COMPATIBILITY:', JSON.stringify(inventory.data.map(model => ({
              id: model.id,
              pickerEnabled: model.model_picker_enabled === true,
              endpoints: Array.isArray(model.supported_endpoints) ? model.supported_endpoints : []
            }))));
          }
          main().catch(() => { console.log('COPILOT_DIAGNOSTIC: lookup failed; no response body or credential printed'); process.exitCode = 1; });
          NODE

  inspect_authorized_provider:
    if: github.event.pull_request.number == 70 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify the authorized model and one bounded Responses tool call
        env:
          ANS_PROVIDER_PROBE_KEY: ${{ secrets.ANS_PR_REVIEW_API_KEY }}
        run: |
          node <<'NODE'
          const key = process.env.ANS_PROVIDER_PROBE_KEY;
          const base = 'https://www.mcgrox.top/v1';
          const model = 'deepseek-v4.1-flash';
          const fail = code => { throw new Error(code); };
          async function request(path, body) {
            const result = await fetch(base + path, {
              method: body ? 'POST' : 'GET',
              headers: { Authorization: `Bearer ${key}`, Accept: 'application/json', ...(body ? { 'Content-Type': 'application/json' } : {}) },
              ...(body ? { body: JSON.stringify(body) } : {}),
              redirect: 'error', signal: AbortSignal.timeout(45000)
            });
            console.log('ANS_PROVIDER_PROBE_HTTP:', path, result.status);
            if (!result.ok) fail(path === '/models' ? 'MODEL_LIST_HTTP_FAILED' : 'RESPONSES_HTTP_FAILED');
            return result.json();
          }
          async function main() {
            if (!key) fail('CREDENTIAL_MISSING');
            const inventory = await request('/models');
            if (!Array.isArray(inventory.data)) fail('MODEL_LIST_INVALID');
            const listed = inventory.data.some(item => item?.id === model);
            console.log('ANS_PROVIDER_PROBE_EXACT_MODEL_LISTED:', listed);
            if (!listed) fail('EXACT_MODEL_NOT_LISTED');
            // One fixed synthetic request, no PR contents/user data, no tools executed,
            // no model retries/fallbacks and at most 512 output tokens.
            const result = await request('/responses', {
              model, store: false, max_output_tokens: 512,
              input: 'Call ans_review_probe once with marker ANS_REVIEW_OK. Do not output prose.',
              tools: [{ type: 'function', name: 'ans_review_probe', description: 'A non-executing compatibility probe.',
                parameters: { type: 'object', properties: { marker: { type: 'string', enum: ['ANS_REVIEW_OK'] } }, required: ['marker'], additionalProperties: false }, strict: true }],
              tool_choice: { type: 'function', name: 'ans_review_probe' }, parallel_tool_calls: false
            });
            const calls = Array.isArray(result.output) ? result.output.filter(item => item?.type === 'function_call') : [];
            if (calls.length !== 1 || calls[0].name !== 'ans_review_probe') fail('TOOL_CALL_INVALID');
            let args;
            try { args = JSON.parse(calls[0].arguments); } catch { fail('TOOL_ARGUMENTS_INVALID'); }
            if (args?.marker !== 'ANS_REVIEW_OK' || Object.keys(args).length !== 1) fail('TOOL_ARGUMENTS_INVALID');
            console.log('ANS_PROVIDER_PROBE_RESPONSES_TOOL_CALL: passed');
            console.log('ANS_PROVIDER_PROBE_REPORTED_MODEL_MATCHES:', result.model === model);
            for (const field of ['input_tokens', 'output_tokens', 'total_tokens']) {
              const value = result.usage?.[field];
              if (Number.isSafeInteger(value) && value >= 0) console.log('ANS_PROVIDER_PROBE_USAGE:', field, value);
            }
          }
          main().catch(error => {
            const known = ['CREDENTIAL_MISSING', 'MODEL_LIST_HTTP_FAILED', 'MODEL_LIST_INVALID', 'EXACT_MODEL_NOT_LISTED', 'RESPONSES_HTTP_FAILED', 'TOOL_CALL_INVALID', 'TOOL_ARGUMENTS_INVALID'];
            console.log('ANS_PROVIDER_PROBE_FAILURE:', known.includes(error?.message) ? error.message : 'NETWORK_OR_RESPONSE_FAILED');
            process.exitCode = 1;
          });
          NODE