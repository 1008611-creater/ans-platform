# Deploy only reviewed main source, with a pinned existing Node image digest.
services:
  model-worker:
    image: ${ANS_WORKER_IMAGE:?Pinned Node runtime image digest is required}
    container_name: ans-production-3d-worker
    user: "10001:10001"
    init: true
    entrypoint: ["node"]
    command: ["/opt/ans/scripts/visual-worker/start.mjs", "start"]
    working_dir: /opt/ans
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 90s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    env_file: ./worker-private.env
    environment:
      ANS_WORKER_SERVER: https://ans.cauai.fun
      ANS_WORKER_ID: ans-production-server-3d
      ANS_TRIPO_CREDENTIAL_FILE: /run/secrets/tripo.json
      ANS_WORKER_JOURNAL: /var/lib/ans-worker/model-journal
      ANS_FOUR_VIEW_JOURNAL: /var/lib/ans-worker/four-view-journal
      ANS_WORKER_STATUS_FILE: /var/lib/ans-worker/status.json
      ANS_TRIPO_ALLOW_SUBMISSIONS: "true"
      ANS_FOUR_VIEW_ENABLED: "false"
      ANS_FOUR_VIEW_API_CONFIRMED: "false"
    volumes:
      - ./runtime:/opt/ans:ro
      - ./private/tripo.json:/run/secrets/tripo.json:ro
      - ./state:/var/lib/ans-worker
    tmpfs: [/tmp:rw,noexec,nosuid,size=32m]
    healthcheck:
      test: [CMD, node, /opt/ans/scripts/visual-worker/healthcheck.mjs]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
