services:
  hypit:
    image: ans-hypit:20261011
    container_name: ans-hypit-workflow
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    environment:
      DATA_ROOT: /data
      PUBLIC_ORIGIN: https://ans.cauai.fun
      ANS_AUTH_ORIGIN: http://ans-platform-app:3000
    volumes:
      - /srv/ans-hypit/engine:/service:ro
      - /srv/ans-hypit/data:/data
    tmpfs:
      - /tmp:size=1g,mode=1777
    networks:
      - ans
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3022/workflows/hypit/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  ans:
    external: true
    name: prompts-chat_default
