services:
  ans-app:
    image: ans:ans-mascot-motion-20261011-r2
    container_name: ans-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4194
      HOST: 0.0.0.0
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      DATA_BACKEND: ${DATA_BACKEND:-json}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.qq.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-ans-assets}
      CF_ANALYTICS_TOKEN: ${CF_ANALYTICS_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      APP_RELEASE: ${APP_RELEASE:-ans@0.1.0}
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      MIMO_TTS_MODEL: ${MIMO_TTS_MODEL:-mimo-v2.5-tts}
    volumes:
      - ans_data:/app/data
    ports:
      - "127.0.0.1:4194:4194"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4194/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  ans_data:


